name: Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version, without the leading v"
        required: true
        default: "0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Check
        run: |
          uv run pytest
          uv run ruff check .
          uv run ruff format . --check

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "${{ inputs.version }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build portable package
        shell: pwsh
        run: .\scripts\build_windows.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Echoes-Windows-v${{ steps.version.outputs.version }}
          path: dist/Echoes-Windows-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Echoes-Windows-v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
